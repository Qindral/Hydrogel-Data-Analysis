[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-analysis"
version = "0.1.0"
description = "Hydrogel data analysis napari plugin"
authors = [{name = "Hydro Team"}]
dependencies = [
    "napari",
    "numpy",
    "tifffile",
    "scipy",
    "qtpy",
    "Pillow",
    "scikit-image",
]

[project.entry-points."napari.manifest"]
hydro-analysis = "napari.yaml"
